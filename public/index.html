<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffd9e8"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><title>Don't Eat Me</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Baloo+Bhaijaan+2:wght@600;800&family=Cairo:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --cocoa:#4a2a3a;--cream:#fff6ea;--cream2:#ffeadb;--pink:#ff6fa5;--pink2:#ffb3d1;--berry:#d93b78;
  --mint:#46cfa8;--mint2:#b6f2df;--butter:#ffe27a;--butter2:#ffc83d;--muted:#9b7385;--bad:#e5484d;--good:#25a97f;
  --p1:#ff6fa5;--p2:#46cfa8;--gold:#ffc83d;--bg:#ffd9e8;
  --display:'Baloo 2','Baloo Bhaijaan 2','Trebuchet MS',system-ui,sans-serif;--body:'Nunito','Cairo',system-ui,sans-serif;
  --gl:max(14px,env(safe-area-inset-left,0px));--gr:max(14px,env(safe-area-inset-right,0px));
  --sh:0 5px 0 var(--cocoa);color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-left:var(--gl);padding-right:var(--gr);background:var(--bg);color:var(--cocoa);font-family:var(--body);font-weight:700;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
button{font-family:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
[hidden]{display:none!important}
/* ---------- generic pieces ---------- */
.logo{margin:0;font:800 clamp(34px,min(7.4vw,8.8vh),86px)/.95 var(--display);color:var(--butter);-webkit-text-stroke:9px var(--cocoa);paint-order:stroke fill;text-shadow:0 7px 0 var(--cocoa);text-align:center;text-wrap:balance;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-.6deg)}}
.tag{margin:12px 0 0;text-align:center;font:800 clamp(14px,2.2vw,20px) var(--display);color:var(--cream);-webkit-text-stroke:5px var(--cocoa);paint-order:stroke fill}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--cream);border:4px solid var(--cocoa);border-radius:999px;box-shadow:0 4px 0 var(--cocoa);padding:3px 14px;font:800 16px var(--display);color:var(--cocoa);pointer-events:auto}
.chip.coin{background:var(--butter)}
button.chip{cursor:pointer}
button.chip:hover{transform:translateY(-2px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:4px solid var(--cocoa);border-radius:999px;box-shadow:0 5px 0 var(--cocoa);padding:8px 22px;font:800 19px var(--display);color:var(--cocoa);background:var(--pink2);pointer-events:auto;transition:transform .12s}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cocoa)}
.btn.pink{background:var(--pink);color:#fff}.btn.mint{background:var(--mint)}.btn.butter{background:var(--butter)}
.btn.dim{background:#d8c5cd;color:#8e7480}
.btn.big{font-size:clamp(22px,3.4vw,32px);padding:10px 38px}
.btn.small{font-size:16px;padding:4px 16px;box-shadow:0 4px 0 var(--cocoa)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.card{background:var(--cream);border:5px solid var(--cocoa);border-radius:28px;box-shadow:0 8px 0 var(--cocoa);padding:22px 26px;max-width:540px;width:100%;text-align:center;font-family:var(--display);pointer-events:auto}
.card h2{margin:0 0 6px;font-size:clamp(30px,6vw,50px);font-weight:800;color:var(--berry);text-wrap:balance;line-height:1.05}
.card p{margin:6px 0;font:700 17px var(--body);color:var(--cocoa)}
.card .small,.small{font-size:14px;color:var(--muted);font-weight:700}
.card .row{display:flex;justify-content:space-between;gap:16px;font:800 17px var(--body);padding:8px 0;border-top:3px dotted rgba(74,42,58,.25)}
.bigemo{font-size:64px;line-height:1;animation:bob 2s ease-in-out infinite}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px var(--gr) 14px var(--gl);overflow:auto}
.overlay.solid{background:linear-gradient(160deg,#ffd0e2,#ffe9b8 55%,#bff0e0)}
.foot{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.hint{font-size:13px;color:var(--cream);max-width:860px;line-height:1.45;-webkit-text-stroke:4px var(--cocoa);paint-order:stroke fill;font-weight:800}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;pointer-events:none}
.topbar>*{pointer-events:auto}
/* ---------- loading ---------- */
.ldbox{text-align:center;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}
.ldlogo{font-size:84px;animation:spin 1.6s ease-in-out infinite}
@keyframes spin{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.15)}}
.ldbar{width:min(360px,80vw);height:26px;border:4px solid var(--cocoa);border-radius:999px;background:var(--cream);overflow:hidden;box-shadow:0 4px 0 var(--cocoa)}
.ldbar i{display:block;height:100%;width:40%;background:repeating-linear-gradient(45deg,var(--pink) 0 14px,var(--pink2) 14px 28px);border-radius:999px;animation:ld 1.4s ease-in-out infinite alternate}
@keyframes ld{from{margin-inline-start:0}to{margin-inline-start:60%}}
#ldmsg{margin:0;font:800 20px var(--display)}
#ldtip{margin:0;font:700 16px var(--body);color:var(--cocoa);background:var(--cream);border:3px solid var(--cocoa);border-radius:18px;padding:8px 16px;max-width:420px}
/* ---------- login ---------- */
#login{background:linear-gradient(to bottom,rgba(255,217,232,.9),rgba(255,217,232,.35))}
#login .card{max-width:440px}
.card input{width:100%;margin:6px 0;padding:11px 14px;border-radius:16px;border:4px solid var(--cocoa);background:#fff;color:var(--cocoa);font:700 17px var(--body)}
.card input:focus{outline:none;border-color:var(--berry);box-shadow:0 0 0 4px var(--pink2)}
.lbtns{display:flex;gap:10px;margin:8px 0 4px}.lbtns .btn{flex:1;padding:8px 6px;font-size:17px}
.ghost{background:transparent;border:3px dashed var(--muted);border-radius:16px;color:var(--muted);padding:8px;width:100%;margin-top:8px;font:800 15px var(--body);cursor:pointer}
.ghost:hover{background:rgba(255,255,255,.6)}
#lmsg{min-height:20px;color:var(--berry)}
/* ---------- title: the menu board ---------- */
#title{flex-direction:column;justify-content:space-between;align-items:stretch;gap:8px;background:linear-gradient(to bottom,rgba(255,200,225,.55),rgba(255,200,225,0) 40%,rgba(255,200,225,0) 65%,rgba(255,200,225,.55));pointer-events:none}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
@media (min-width:900px){.tcol{align-items:flex-start;padding-inline-start:5vw}.tcol .logo,.tcol .tag{text-align:start}}
.board{width:min(480px,100%);max-height:calc(100vh - 222px);min-height:120px;overflow:auto;background-color:var(--cream);background-image:repeating-linear-gradient(0deg,transparent 0 35px,rgba(74,42,58,.05) 35px 36px);border:5px solid var(--cocoa);border-radius:28px;box-shadow:0 8px 0 var(--cocoa);padding:12px 12px 10px;pointer-events:auto;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.board h3{font:800 23px var(--display);text-align:center;margin:0 0 6px;color:var(--berry);letter-spacing:.05em;text-transform:uppercase}
.board>p{margin:4px 8px;text-align:center;font-size:15px}
.dish{display:flex;align-items:center;gap:10px;padding:3px 10px;border-radius:18px;border:3px solid transparent;cursor:pointer;font-family:var(--display);transition:transform .1s}
.dish .ic{font-size:26px;width:36px;text-align:center;flex:none}
.dish .nm{font-weight:800;font-size:19px;line-height:1.1}
.dish .nm small{display:block;font:700 12.5px var(--body);color:var(--muted);margin-top:1px}
.dish .dots{flex:1;min-width:10px;border-bottom:3px dotted rgba(74,42,58,.3);margin-bottom:9px;align-self:flex-end}
.dish .pr{font-weight:800;font-size:17px;color:var(--berry);white-space:nowrap}
.dish.cur,.dish:hover{background:var(--butter);border-color:var(--cocoa);box-shadow:0 3px 0 var(--cocoa);transform:translateY(-1px) scale(1.02)}
.dish.off{opacity:.55}
.fgrid,.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 4px}
.fcard,.badge{background:#fff;border:3px solid var(--cocoa);border-radius:16px;padding:6px 4px;text-align:center;font-family:var(--display);line-height:1.1}
.fcard .e,.badge .e{font-size:30px}
.fcard b{display:block;font-size:13.5px}.fcard small,.badge small{display:block;font:700 11px var(--body);color:var(--muted)}
.fcard.lock{opacity:.5;filter:grayscale(1)}
.xp{height:8px;border:2px solid var(--cocoa);border-radius:6px;background:#fff;overflow:hidden;margin:3px 6px 0}.xp i{display:block;height:100%;background:var(--mint)}
.badge.lock{filter:grayscale(1);opacity:.5}.badge b{display:block;font-size:13.5px}
.badge.got{background:var(--butter)}
.pstats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.pstat{background:#fff;border:3px solid var(--cocoa);border-radius:14px;padding:2px 12px;font:800 15px var(--display);text-align:center}.pstat small{display:block;font:700 11px var(--body);color:var(--muted)}
.prof{display:flex;align-items:center;gap:12px;justify-content:center;font-family:var(--display);margin:2px 0}
.pavatar{width:64px;height:64px;border-radius:50%;background:var(--pink2);border:4px solid var(--cocoa);display:grid;place-items:center;font-size:36px}
.tut{text-align:center;padding:6px 10px}.tut .e{font-size:76px;line-height:1.1;animation:bob 2.4s ease-in-out infinite}.tut h4{margin:4px 0;font:800 24px var(--display);color:var(--berry)}.tut p{margin:4px 0 8px;font-size:16px;line-height:1.45}
.pgdots{display:flex;gap:6px;justify-content:center;margin:4px 0}.pgdots i{width:12px;height:12px;border-radius:50%;border:3px solid var(--cocoa);background:#fff}.pgdots i.on{background:var(--pink)}
/* ---------- character select ---------- */
#menu{flex-direction:column;align-items:stretch;justify-content:space-between;gap:8px;background:linear-gradient(to bottom,rgba(255,200,225,.5),rgba(255,200,225,0) 30%,rgba(255,200,225,0) 45%,rgba(255,200,225,.8));pointer-events:none}
.modechip{font:800 clamp(18px,3vw,30px) var(--display);color:var(--cream);-webkit-text-stroke:7px var(--cocoa);paint-order:stroke fill;text-align:center}
.selwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:900px;width:100%;margin:0 auto;align-items:end}
.selcard{background:var(--cream);border:5px solid var(--cocoa);border-radius:26px;box-shadow:0 7px 0 var(--cocoa);padding:10px 14px 14px;pointer-events:auto;font-family:var(--display);min-width:0;display:flex;flex-direction:column;gap:6px}
.selcard.s0{border-top:14px solid var(--p1)}.selcard.s1{border-top:14px solid var(--p2)}
.selcard.ready{background:#e9fff7}
.selhd{display:flex;justify-content:space-between;align-items:center}
.pbadge{background:var(--cocoa);color:var(--cream);border-radius:12px;padding:0 12px;font-weight:800;font-size:15px}
.dev{font-size:13px;color:var(--muted)}
.plus{font-size:50px;text-align:center;color:var(--muted);line-height:1.1}
.selnav{display:flex;align-items:center;gap:6px}
.arrow{width:44px;height:44px;border-radius:50%;border:4px solid var(--cocoa);background:var(--butter);font:800 28px/1 var(--display);cursor:pointer;box-shadow:0 4px 0 var(--cocoa);color:var(--cocoa);flex:none}
.arrow:hover{transform:scale(1.1)}.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cocoa)}
[dir=rtl] .arrow{transform:scaleX(-1)}
.selname{flex:1;text-align:center;min-width:0}.fname{font-weight:800;font-size:clamp(19px,2.6vw,26px);line-height:1.05}.fsub{font:700 13px var(--body);color:var(--muted)}
.lvrow{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}.lvrow .xp{flex:1;margin:0}
.srow{display:flex;justify-content:space-between;font:800 14px var(--body)}.srow span:last-child{letter-spacing:2px;color:var(--berry)}
.pwr{background:#fff;border:3px solid var(--cocoa);border-radius:14px;padding:4px 10px;font:700 13.5px/1.3 var(--body)}.pwr b{color:var(--berry);font-family:var(--display);font-size:15px}
/* ---------- HUD ---------- */
#hud{position:fixed;left:var(--gl);right:var(--gr);top:calc(env(safe-area-inset-top,0px) + 10px);display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;pointer-events:none;direction:ltr}
#h0{justify-self:start}#h1{justify-self:end}#center{grid-column:2}#h0{grid-column:1}#h1{grid-column:3}
.pcard{display:flex;gap:10px;align-items:center;border:4px solid var(--cocoa);border-radius:24px;box-shadow:var(--sh);padding:8px 12px 8px 10px;color:var(--cocoa);width:min(310px,34vw);min-width:0}
.pcard.p0{background:linear-gradient(#fff6ea,#ffdcea)}.pcard.p1{background:linear-gradient(#fff6ea,#d6f7ec)}
.pcard.down{filter:grayscale(.7)}
.av{position:relative;width:54px;height:54px;flex:none;border-radius:50%;border:4px solid var(--cocoa);display:grid;place-items:center;font-size:30px;background:var(--pink2)}
.p1 .av{background:var(--mint2)}
.av b{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--cocoa);color:var(--cream);font:800 11px var(--display);border-radius:8px;padding:0 6px}
.pbody{flex:1;min-width:0;font-family:var(--display)}
.pbody .top{display:flex;gap:6px;align-items:center}
.nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lv{margin-left:auto;font-size:12px;font-weight:800;background:var(--butter);border:2px solid var(--cocoa);border-radius:10px;padding:0 7px;white-space:nowrap}
.hearts{display:flex;gap:1px;font-size:15px;line-height:1.15;flex-wrap:wrap}.hearts i{font-style:normal}.hearts i.off{filter:grayscale(1);opacity:.3}
.coins{font-weight:800;font-size:14px}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;width:58px;text-align:center}
.pring{--a:0deg;width:46px;height:46px;border-radius:50%;border:4px solid var(--cocoa);background:conic-gradient(var(--pink) var(--a),#eadbe0 0);display:grid;place-items:center;font-size:20px}
.pring span{width:30px;height:30px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:17px}
.pring.ready{animation:ready .7s ease-in-out infinite alternate;background:var(--butter2)}
@keyframes ready{to{transform:scale(1.14)}}
.pname{font:800 10.5px var(--display);line-height:1;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
#center{text-align:center;font-family:var(--display);background:var(--cream);border:4px solid var(--cocoa);border-radius:24px;box-shadow:var(--sh);padding:4px 18px 6px;min-width:0;color:var(--cocoa)}
#center .stage{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#center .wave{font-size:28px;font-weight:800;line-height:1;color:var(--berry)}
#center .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#center .taste{color:var(--butter2);-webkit-text-stroke:3px var(--cocoa);paint-order:stroke fill;letter-spacing:.1em}
#center .combo{color:var(--berry);font-weight:800;font-size:15px;min-height:18px}
#bossbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 142px);width:min(540px,60vw);text-align:center;font-family:var(--display);pointer-events:none}
#bossbar .bn{font-size:20px;font-weight:800;color:var(--cream);-webkit-text-stroke:6px var(--cocoa);paint-order:stroke fill}
#bossbar .bar{height:20px;border-radius:12px;background:var(--cream);border:4px solid var(--cocoa);overflow:hidden;box-shadow:0 4px 0 var(--cocoa)}
#bossbar .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5d8f,#ff9cc2)}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;pointer-events:none;font-family:var(--display);opacity:0;padding:0 14px}
#banner h2{margin:0;font-size:clamp(36px,8.4vw,88px);font-weight:800;color:var(--butter);-webkit-text-stroke:12px var(--cocoa);paint-order:stroke fill;text-shadow:0 8px 0 var(--cocoa);text-wrap:balance;line-height:1}
#banner p{display:inline-block;margin:10px 0 0;font:800 clamp(16px,2.6vw,26px) var(--display);color:var(--cocoa);background:var(--cream);border:4px solid var(--cocoa);border-radius:999px;padding:2px 20px;box-shadow:0 4px 0 var(--cocoa)}
#banner p:empty{display:none}
#banner.show{animation:bn 2.6s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:scale(.5) rotate(-4deg)}12%{opacity:1;transform:scale(1.1) rotate(1deg)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);max-width:min(640px,92vw);text-align:center;pointer-events:none;font:800 clamp(15px,2.3vw,21px) var(--display);opacity:0;background:var(--cream);border:4px solid var(--cocoa);border-radius:20px;box-shadow:0 5px 0 var(--cocoa);padding:6px 18px;color:var(--cocoa)!important}
#toast.show{animation:ts 2.6s ease-out forwards}
@keyframes ts{0%{opacity:0;margin-bottom:-14px}10%{opacity:1;margin-bottom:0}85%{opacity:1}100%{opacity:0}}
#achpop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;background:var(--butter);border:4px solid var(--cocoa);border-radius:22px;box-shadow:0 6px 0 var(--cocoa);padding:6px 20px 6px 12px;font-family:var(--display);pointer-events:none}
#achpop .e{font-size:38px}#achpop b{display:block;font-size:18px}#achpop small{font:700 13px var(--body)}
#achpop.show{animation:ap 4.2s ease-out forwards}
@keyframes ap{0%{opacity:0;transform:translate(-50%,-40px) scale(.7)}10%{opacity:1;transform:translate(-50%,0) scale(1.06)}16%{transform:translate(-50%,0) scale(1)}88%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
/* ---------- shop shelf ---------- */
#shop{flex-direction:column;gap:10px;justify-content:center;background:rgba(255,226,236,.82);backdrop-filter:blur(3px)}
.shoptop{text-align:center;font-family:var(--display)}
.shoptop h2{margin:0;font-size:clamp(26px,5vw,46px);color:var(--cream);font-weight:800;-webkit-text-stroke:9px var(--cocoa);paint-order:stroke fill}
.shoptop p{display:inline-block;margin:6px 0 0;background:var(--cream);border:3px solid var(--cocoa);border-radius:999px;padding:1px 16px;font:800 14px var(--body)}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1040px;width:100%}
.sp{background:var(--cream);border:5px solid var(--cocoa);border-radius:26px;box-shadow:0 7px 0 var(--cocoa);padding:8px 10px 10px;min-width:0}
.sp.s0{border-top:14px solid var(--p1)}.sp.s1{border-top:14px solid var(--p2)}
.sph{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:19px;margin-bottom:6px}
.sph .cn{background:var(--butter);border:3px solid var(--cocoa);border-radius:999px;padding:0 12px;font-size:17px}
.shelfgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.item{position:relative;background:#fff;border:3px solid var(--cocoa);border-radius:16px;padding:6px 3px 22px;text-align:center;cursor:pointer;font-family:var(--display);color:var(--cocoa);display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;transition:transform .1s}
.item .ico{font-size:30px;line-height:1.1}.item b{font-size:13px;line-height:1.05}.item small{font:700 10.5px/1.15 var(--body);color:var(--muted)}
.item .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}.item .dots i{width:7px;height:7px;border-radius:50%;border:2px solid var(--cocoa);background:#fff}.item .dots i.on{background:var(--mint)}

const mc={};
function M(c,o){const k=c+(o?JSON.stringify(o):'');return mc[k]||(mc[k]=TM(c,o));}
/* dark outline around big parts (a slightly bigger inside-out copy), like a cartoon */
const OUTM=new THREE.MeshBasicMaterial({color:0x3a1d2c,side:THREE.BackSide});

    if(Math.min(sc[0],sc[1],sc[2])<.05)continue;

    o.scale.set(k[0],k[1],k[2]);o.position.set(-e.c[0]*(k[0]-1),-e.c[1]*(k[1]-1),-e.c[2]*(k[2]-1));o.userData.ol=1;o.castShadow=false;m.add(o);

let ac=null,master=null,sfxBus=null,musBus=null,noiseBuf=null,audioOk=false;
function ensureAudio(){
  try{
    if(!ac){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      ac=new C();const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.connect(ac.destination);
      master=ac.createGain();master.connect(comp);sfxBus=ac.createGain();sfxBus.connect(master);musBus=ac.createGain();musBus.gain.value=0;musBus.connect(master);
      noiseBuf=ac.createBuffer(1,(ac.sampleRate*.6)|0,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    audioOk=true;
    if(ac.state==='suspended'&&!document.hidden&&document.hasFocus())ac.resume().catch(()=>{});
  }catch(e){}
}
function audioPause(){try{if(ac&&ac.state==='running')ac.suspend();}catch(e){}}

function tone(f,d,type,vol,slide,delay,bus){
  if(!ac||ac.state!=='running'||!save.vol)return;
  try{
    const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(bus||sfxBus);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
function noise(d,vol,freq,q,delay,bus,type){
  if(!ac||ac.state!=='running'||!save.vol||!noiseBuf)return;
  try{
    const t=ac.currentTime+(delay||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();

    s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t,Math.random()*.2);s.stop(t+d+.02);
  }catch(e){}
}

/* music: a real little song (chords, bass, melody, drums), scheduled ahead so it never stutters */
const MUS={next:0,step:0};
const PROG=[[0,4,7],[7,11,14],[9,12,16],[5,9,12]],PROG_B=[[0,3,7],[8,12,15],[3,7,10],[10,14,17]];
const MEL=[[12,-1,16,-1,19,16,14,-1],[14,-1,-1,11,14,-1,19,-1],[16,-1,14,-1,12,-1,9,12],[12,-1,9,-1,7,-1,-1,-1]];
const MEL_B=[[12,-1,15,12,19,-1,17,15],[20,-1,19,-1,15,-1,12,-1],[15,-1,17,19,22,-1,19,-1],[17,-1,15,14,12,-1,-1,-1]];
const hz=n=>440*Math.pow(2,(n-69)/12);
function musicTick(){
  if(!ac||ac.state!=='running')return;
  const calm=mode==='title'||mode==='login'||mode==='menu',isBoss=mode==='play'&&!!boss,paused=mode==='pause'||mode==='over';
  const want=!save.music||!save.vol?0:(paused?.18:(mode==='shop'?.4:.55));
  musBus.gain.setTargetAtTime(want,ac.currentTime,.15);
  master.gain.setTargetAtTime(save.vol/3*.9,ac.currentTime,.05);
  if(!want){MUS.next=0;return;}
  const bpm=isBoss?152:(calm?96:124),spb=60/bpm/2,now=ac.currentTime;
  if(MUS.next<now)MUS.next=now+.05;
  while(MUS.next<now+.16){
    const st=MUS.step++,t=MUS.next-now,pos=st%8,bar=Math.floor(st/8)%4,phrase=Math.floor(st/32)%2,P=isBoss?PROG_B:PROG,ch=P[bar],root=isBoss?45:48;
    if(pos%2===0)tone(hz(root-12+ch[0]+(pos===6?7:0)),spb*1.8,'triangle',.11,0,t,musBus);
    if(!calm||pos%2===0)tone(hz(root+12+ch[[0,1,2,1][pos%4]]),spb*.9,'square',calm?.018:.022,0,t,musBus);
    const m=(isBoss?MEL_B:MEL)[bar][pos];
    if(m>=0&&(phrase===1||calm))tone(hz(root+12+m),spb*1.7,isBoss?'sawtooth':'triangle',calm?.035:.04,0,t,musBus);
    if(!calm){
      if(pos===0||pos===4){tone(120,.12,'sine',.18,-80,t,musBus);}
      if(pos===2||pos===6)noise(.1,.06,2200,.8,t,musBus);
      noise(.03,pos%2?.025:.015,8000,1,t,musBus,'highpass');
    }
    MUS.next+=spb;
  }
}

function pushOut(o,r){

        else{const px=b.hw-Math.abs(o.x-b.x),pz=b.hd-Math.abs(o.z-b.z);if(px<pz)o.x+=(o.x>b.x?1:-1)*(px+r);else o.z+=(o.z>b.z?1:-1)*(pz+r);}

    }
  }

function blocked(x,z){

    if(b.t===0){if(Math.abs(x-b.x)<b.hw&&Math.abs(z-b.z)<b.hd)return true;}
    else if(Math.hypot(x-b.x,z-b.z)<b.r)return true;
  }

}

function poll(dev){

      if(b(14))s.mx=-1;if(b(15))s.mx=1;if(b(12))s.mz=-1;if(b(13))s.mz=1;
      const std=gp.mapping==='standard',ai=std?2:(gp.axes.length>=6?2:2),aj=std?3:(gp.axes.length>=6?5:3);
      s.ax=dz(gp.axes[ai]||0);s.az=dz(gp.axes[aj]||0);
      s.fire=b(7)||b(5)||Math.hypot(s.ax,s.az)>.45;

    const dz=v=>Math.abs(v)<.18?0:v;

    touch.rollL=touch.powL=false;

    const k=c=>keysDown.has(c)?1:0;

}

/* ---------- waves ---------- */
function composeWave(n){
  const isBoss=n%5===0,solo=players.length<2;
  let cnt=Math.round((TUNING.waveBase+n*TUNING.wavePer)*(solo?TUNING.solo.cnt:1)*DF().cnt*(1+.1*taste()));
  if(isBoss)cnt=Math.round(cnt*.55);
  let elites=Math.max(0,cnt-TUNING.waveMaxUnits);cnt-=elites;
  const ch=n>=TUNING.eliteFrom?Math.min(TUNING.eliteChanceMax,(n-TUNING.eliteFrom+1)*TUNING.eliteChance):0;
  const pool=SPAWNS.filter(s=>s.w<=n),tot=pool.reduce((a,s)=>a+s.wt,0),q=[];
  for(let i=0;i<cnt;i++){
    let r=Math.random()*tot,k=pool[0].k;
    for(const s of pool){r-=s.wt;if(r<=0){k=s.k;break;}}
    q.push({k,el:Math.random()<ch});
  }
  for(let i=0;i<q.length&&elites>0;i++){const j=(Math.random()*q.length)|0;if(!q[j].el){q[j].el=true;elites--;}}
  if(isBoss)q.unshift({k:'boss'});
  return q;
}
function clearWorld(){

  for(const d of dying)scene.remove(d.g);

  for(const p of parts)scene.remove(p.m);

  for(const z of zones){scene.remove(z.m);z.m.material.dispose();}
  for(const e of skyEggs)scene.remove(e.m);
  for(const s of slashes){scene.remove(s.g);s.m.material.dispose();}
  for(const p of pops){scene.remove(p.s);p.s.material.dispose();}for(const f of floaters){scene.remove(f.s);f.s.material.dispose();}pops=[];floaters=[];
  enemies=[];dying=[];pB=[];eB=[];pickups=[];coinsL=[];parts=[];rings=[];splats=[];nums=[];zones=[];skyEggs=[];slashes=[];
  boss=null;combo=0;comboT=0;$('bossbar').hidden=true;
}

    players.forEach((p,i)=>{p.x=players.length>1?(i?4:-4):0;p.z=8;p.vx=p.vz=0;p.g.position.set(p.x,0,p.z);if(p.downed)revive(p,1);});
  }
  waveHit=false;for(const p of players)p.lunch=PL('lunch')>0;spawnQ=composeWave(n);spawnCd=1.2;wstate='fight';sfx.wave();punch=Math.max(punch,.05);flashScreen('#fff6ea');
  const sl=tr(gameType==='story'&&n%5===1?STORY[st]:STAGES[st].name);banner(gameType==='story'&&n===STORY_END?tr('FINAL BOSS!'):(n%5===0?tr('BOSS WAVE!'):tr('Wave %1',n)),sl);if(n>=10)award('wave10');

function waveStep(dt){
  if(wstate==='fight'){

      const k=spawnQ.shift();

function playStep(dt){
  for(const p of players){
    const s=poll(p.dev);
    if(s.startP)reqPause=true;
    updatePlayer(p,dt,s);
  }
  if(reqPause){setPause(true);return;}
  comboT-=dt;if(comboT<=0)combo=0;
  updateEnemies(dt);updateBullets(dt);updatePickups(dt);updateCoins(dt,wstate==='inter');updateZonesEggs(dt);waveStep(dt);updateHud();
  if(mode==='play'&&players.length&&!players.some(p=>!p.downed||p.autoRev>0))endGame();
}
function pauseStep(){
  for(const p of players){
    const s=poll(p.dev);if(s.startP)reqPause=true;if(s.backP)reqQuit=true;
    if(s.upP||s.downP){pCur=(pCur+(s.downP?1:2))%3;sfx.tick();renderPause();}
    if(s.confirmP||s.rollP){pauseOk();}
  }
  if(keysDown.has('KeyQ')||reqQuit){reqQuit=false;toMenu();return;}
  if(reqPause)setPause(false);
}
function overStep(dt){
  overT-=dt;
  if(overT>0)updateEnemies(dt*.3);
  let go=reqStart;
  for(const p of players){const s=poll(p.dev);if(s.confirmP||s.startP)go=true;}
  if(overT<=0&&$('over').hidden){showOver();go=false;}
  if(overT<=-.4&&go)toMenu();
}

let lastMode='',touchOn=false;

function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(hitStop>0){hitStop-=dt;dt*=.08;}
  time+=dt;
  if(mode==='title')titleStep(dt);else if(mode==='menu')menuStep(dt);else if(mode==='login'){for(const g of showFoods)g.rotation.y+=dt*.9;for(const l of lockLbl)l.visible=false;}
  else if(mode==='play')playStep(dt);
  if(mode==='login'||!$('loading').hidden)loginPadStep();
  else if(mode==='shop')shopStep(dt);
  else if(mode==='pause')pauseStep();
  else if(mode==='over')overStep(dt);
  if(mode!=='pause')updateFx(dt);
  updateVig(dt);
  if(mode!==lastMode){lastMode=mode;document.body.classList.toggle('playing',mode==='play'||mode==='pause'||mode==='shop'||mode==='over');}
  {const tv=mode==='play'&&players.some(p=>p.dev.type==='touch');if(tv!==touchOn){touchOn=tv;$('touch').hidden=!tv;}}
  updateCamera(dt);
  renderer.render(scene,camera);
  reqPause=false;reqStart=false;
}

  killAll(){for(const e of enemies.slice())damageEnemy(e,9999,players[0]||null,0,0,false);spawnQ=[];},
  setWave(n){wave=n-1;startWave(n);},hurt(i){return hurt(players[i]);},spawn(k,x,z,el){return spawnEnemy(k,x,z,el);},curse(i,t){return applyCurse(players[i],t);},openShop(){openShop();}};
